# ============================================================
# Tutor IA — Fundamentos de Base de Datos UPEC
# Docker Compose: Orquestación de servicios contenerizados
# ============================================================
# Ollama se ejecuta como servicio de esta composición.
# Su entrypoint prepara los modelos configurados.
# ============================================================

services:
  # ── Base de Datos Vectorial ──────────────────────────────
  db:
    build: ./database
    container_name: tutor-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tutor-net

  # ── Inteligencia Artificial (Ollama + Mistral) ───────────
  ollama:
    build: ./ollama
    container_name: tutor-ollama
    restart: always
    environment:
      - OLLAMA_NUM_PARALLEL=1
      - OLLAMA_MAX_LOADED_MODELS=1
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - tutor-net
  # ── Caché en Memoria (Redis) ──────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: tutor-redis
    restart: always
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redisdata:/data
    networks:
      - tutor-net

  # ── Backend API (FastAPI + Gunicorn + RAG) ──────────────────
  backend:
    build: ./backend
    container_name: tutor-backend
    restart: always
    # Sin "ports": la API solo es accesible a través de nginx (frontend), que añade
    # las cabeceras de seguridad y la IP real del cliente para el límite de peticiones.
    expose:
      - "8000"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tutor_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tutor_secure_password_2024}
      POSTGRES_DB: ${POSTGRES_DB:-tutor_bd_upec}
      DB_HOST: db
      DB_PORT: 5432
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-mistral}
      REDIS_URL: redis://redis:6379/0
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-qwen/qwen3.8-27b}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      SECRET_KEY: ${SECRET_KEY:?Define SECRET_KEY in .env}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:?Define ALLOWED_ORIGINS in .env}
      # Correo saliente (códigos de recuperación de contraseña)
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-AMY Tutor UPEC}
      SMTP_SECURITY: ${SMTP_SECURITY:-starttls}
      # Umbral mínimo de similitud coseno para el retriever híbrido (0.0 - 1.0)
      SIMILARITY_THRESHOLD: ${SIMILARITY_THRESHOLD:-0.55}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      ollama:
        condition: service_started
    networks:
      - tutor-net

  # ── Frontend (React en Producción con Nginx) ──────────────
  frontend:
    build: ./frontend
    container_name: tutor-frontend
    restart: always
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      - backend
    networks:
      - tutor-net

# ── Volúmenes Persistentes ──────────────────────────────────
volumes:
  pgdata:
    name: tutor-pgdata
  ollama_data:
    name: tutor-ollama-data
  redisdata:
    name: tutor-redis-data

# ── Red Interna ─────────────────────────────────────────────
networks:
  tutor-net:
    driver: bridge
    name: tutor-network
