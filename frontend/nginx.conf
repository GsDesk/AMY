server {
    listen 80;
    server_name localhost;

    # Ocultar versión de Nginx (Information Disclosure mitigation)
    server_tokens off;

    # Encabezados de Seguridad HTTP
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Compilación de React servida estáticamente
    root /usr/share/nginx/html;
    index index.html;

    # Soporte para React Router (redirección interna) sin caché en index.html
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Tamaño máximo por defecto (el chat admite adjuntos de 20 MB ≈ 27 MB en base64)
    client_max_body_size 30M;

    # Ingesta de libros y PDFs pesados: solo rutas de administración (exigen rol admin)
    location ~ ^/api/(admin|rag)/ {
        client_max_body_size 100M;
        proxy_pass http://tutor-backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_connect_timeout 300s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;
        send_timeout          300s;
        proxy_buffering off;
        proxy_request_buffering off;
    }

    # Proxy inverso para la API de FastAPI
    location /api/ {
        proxy_pass http://tutor-backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Se SOBRESCRIBE con la IP de la conexión (no se concatena): el cliente no puede
        # falsificar su IP y burlar el límite de peticiones del backend
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # Timeouts extendidos para Ollama/Mistral 7B en CPU (puede tardar hasta 3-5 min)
        proxy_connect_timeout 300s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;
        send_timeout          300s;

        # Desactivar buffering para que el cliente no espere el buffer completo
        proxy_buffering off;
        proxy_request_buffering off;
    }

    # Proxy inverso para el endpoint de salud
    location /health {
        proxy_pass http://tutor-backend:8000/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 10s;
        proxy_read_timeout    10s;
    }

}
