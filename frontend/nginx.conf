server {
    listen 80;
    server_name localhost;

    # Compilación de React servida estáticamente
    root /usr/share/nginx/html;
    index index.html;

    # Soporte para React Router (redirección interna)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy inverso para la API de FastAPI
    location /api/ {
        proxy_pass http://tutor-backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # Timeouts extendidos para Ollama/Mistral 7B en CPU (puede tardar hasta 3-5 min)
        proxy_connect_timeout 300s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;
        send_timeout          300s;

        # Desactivar buffering para que el cliente no espere el buffer completo
        proxy_buffering off;
        proxy_request_buffering off;
    }

    # Proxy inverso para el endpoint de salud
    location /health {
        proxy_pass http://tutor-backend:8000/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 10s;
        proxy_read_timeout    10s;
    }

}
