server {
    listen 80;
    server_name localhost;

    # Ocultar versión de Nginx (Information Disclosure mitigation)
    server_tokens off;

    # Encabezados de Seguridad HTTP
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Micrófono permitido solo para el propio sitio (dictado por voz en el chat)
    add_header Permissions-Policy "camera=(), microphone=(self), geolocation=()" always;

    # Compilación de React servida estáticamente
    root /usr/share/nginx/html;
    index index.html;

    # Compresión de la app (el JS del chat pasa de ~1,6 MB a ~0,5 MB). Solo en los
    # archivos estáticos: en /api/ se desactiva porque rompería el streaming del chat.
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript text/javascript application/json image/svg+xml;

    # Archivos generados por Vite: llevan un hash en el nombre, así que el navegador
    # (sobre todo en móvil) puede guardarlos para siempre y no volver a descargarlos
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Soporte para React Router (redirección interna) sin caché en index.html
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        # Un add_header en el location anula los del server: se repite aquí
        add_header Permissions-Policy "camera=(), microphone=(self), geolocation=()" always;
    }

    # Tamaño máximo por defecto (el chat admite adjuntos de 20 MB ≈ 27 MB en base64)
    client_max_body_size 30M;

    # Ingesta de libros y PDFs pesados: solo rutas de administración (exigen rol admin)
    location ~ ^/api/(admin|rag)/ {
        client_max_body_size 100M;
        proxy_pass http://tutor-backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_connect_timeout 300s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;
        send_timeout          300s;
        proxy_buffering off;
        proxy_request_buffering off;
        gzip off;
    }

    # Proxy inverso para la API de FastAPI
    location /api/ {
        proxy_pass http://tutor-backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Se SOBRESCRIBE con la IP de la conexión (no se concatena): el cliente no puede
        # falsificar su IP y burlar el límite de peticiones del backend
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # Timeouts extendidos para Ollama/Mistral 7B en CPU (puede tardar hasta 3-5 min)
        proxy_connect_timeout 300s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;
        send_timeout          300s;

        # Desactivar buffering para que el cliente no espere el buffer completo
        proxy_buffering off;
        proxy_request_buffering off;
        gzip off;
    }

    # Proxy inverso para el endpoint de salud
    location /health {
        proxy_pass http://tutor-backend:8000/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 10s;
        proxy_read_timeout    10s;
    }

}
